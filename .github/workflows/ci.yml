name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted properly:"
            echo "$UNFORMATTED"
            echo "Please run: gofmt -w ."
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Verify Clean Build
        run: go build -v -ldflags="-s -w" ./cmd/torn
